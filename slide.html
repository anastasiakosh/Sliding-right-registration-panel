<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Auth</title>
    <link rel="stylesheet" href="slide-right.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Register</h1>
                <input type="text" placeholder="Username" />
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <button>Sign Up</button>
                <span class="social-text">Or sign up with:</span>
                <div class="social-container">
                    <a href="#" class="social">Google</a>
                    <a href="#" class="social">Facebook</a>
                    <a href="#" class="social">GitHub</a>
                    <a href="#" class="social">LinkedIn</a>
                </div>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form action="#">
                <h1>Login</h1>
                <input type="text" placeholder="Username" />
                <input type="password" placeholder="Password" />
                <button>Login</button>
                <span class="social-text">Or login with:</span>
                <div class="social-container">
                    <a href="#" class="social">Google</a>
                    <a href="#" class="social">Facebook</a>
                    <a href="#" class="social">GitHub</a>
                    <a href="#" class="social">LinkedIn</a>
                </div>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <button class="ghost" id="signIn">Login</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello!</h1>
                    <button class="ghost" id="signUp">Register</button>
                </div>
            </div>
        </div>
    </div>
    <script src="slide-right.js"></script>
</body>
</html>
